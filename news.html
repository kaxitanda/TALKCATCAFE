<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>お知らせ | 喋る猫カフェ -talk cat cafe- | VRChatロールプレイカフェイベント公式サイト</title>
  <meta name="description" content="「喋る猫カフェ」の開催情報・メニュー追加・キャスト更新などのお知らせ一覧です。">

  <!-- Webフォント -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant:wght@500;600&family=Shippori+Mincho:wght@500;600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">

  <!-- CSS（役割ごとに分割。読み込み順が上書きの優先順位に影響します） -->
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <!-- お知らせ関連ページ（一覧・記事）に特有の記述のみを担当する個別CSS -->
  <link rel="stylesheet" href="css/news.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <!-- ============================================
       ヘッダー（他ページと共通）
  ============================================ -->
  <header class="site-header is-transparent">
    <div class="site-header__inner">
      <a href="index.html" class="site-header__logo">
        <!-- 通常時のロゴと、ヒーロー上（透明状態）用の白ロゴ。
             表示の切り替えはCSS（.is-transparent）で行う。
             非表示側はdisplay:noneで読み上げ対象から外れるため、
             両方に同じaltを付与して名称を常に担保する。 -->
        <img class="site-header__logo-img site-header__logo-img--default" src="assets/images/logo.svg" alt="喋る猫カフェ -talk cat cafe-" width="180" height="59">
        <img class="site-header__logo-img site-header__logo-img--inverse" src="assets/images/logo-white.svg" alt="喋る猫カフェ -talk cat cafe-" width="180" height="59">
      </a>

      <nav class="site-nav" aria-label="グローバルナビゲーション">
        <button type="button" class="site-nav__toggle" aria-expanded="false" aria-controls="site-nav-list">
          <span class="sr-only">メニューを開閉する</span>
          <span class="site-nav__toggle-bar" aria-hidden="true"></span>
        </button>
        <ul class="site-nav__list" id="site-nav-list">
          <li><a href="concept.html">コンセプト</a></li>
          <li><a href="menu.html">メニュー</a></li>
          <li><a href="store.html">店舗</a></li>
          <li><a href="cast.html">キャスト</a></li>
          <li><a href="system.html">システム</a></li>
          <li><a href="guide.html">参加案内</a></li>
          <li><a href="about.html">運営情報</a></li>
          <li><a href="contact.html">お問い合わせ</a></li>
        </ul>
      </nav>

      <!-- 次回開催日は main.js 先頭の NEXT_EVENT_DATE から自動で書き込む（全ページ共通）。
           ここに書いた文言は、JavaScriptが無効な環境でのみ表示される予備の表示。 -->
      <p class="site-header__badge" data-next-event>次回開催：お知らせをご確認ください</p>
    </div>
  </header>

  <main id="main">

    <!-- ============================================
         ページヒーロー（他の下層ページと同じ.hero--subを流用）
    ============================================ -->
    <section class="hero hero--sub" aria-label="お知らせ一覧ページ ヘッダービジュアル">
      <div class="hero__media">
        <img class="hero__image" src="assets/images/hero/hero-news.jpg" alt="">
      </div>

      <div class="hero__overlay" aria-hidden="true"></div>

      <div class="hero__content">
        <p class="hero__eyebrow">News</p>
        <h1 class="hero__title">お知らせ</h1>
      </div>
    </section>

    <!-- ============================================
         お知らせ一覧（カード形式・新しい順・全件表示）
         トップページのお知らせ欄とは別の、一覧ページ専用の部品。
         サムネイルには、各記事ページのヒーロー画像と同じ画像を使う。
         記事を追加する場合は、先頭に.news-archive__itemの<li>を1つ追加し、
         以下を書き換える。
         ・リンク先（news-◯◯◯.html）
         ・サムネイル画像（記事ページのヒーロー画像と同じパス。例：assets/images/news/news-001.jpg）
         ・日付（datetimeと表示の両方）
         ・タイトル
         サムネイルはリンク内のタイトルと内容が重複するため、alt=""とする。
         ※現在の3件は仮のお知らせのため、リンク先はすべてひな形
           （news-template.html）、画像はひな形と同じ初期画像（hero/hero-news.jpg）。
    ============================================ -->
    <section class="news-archive reveal" aria-labelledby="news-archive-title">
      <div class="news-archive__inner">
        <h2 id="news-archive-title" class="sr-only">お知らせ一覧</h2>
        <ul class="news-archive__list">
          <li class="news-archive__item">
            <a href="news-000.html" class="news-archive__link">
              <img class="news-archive__thumb" src="assets/images/news/news-000.jpg" alt="" loading="lazy">
              <div class="news-archive__body">
                <time class="news__date" datetime="2026-09-23">2026.09.23</time>
                <p class="news-archive__title">喋る猫カフェ -TALK CAT CAFE- 営業開始のお知らせ</p>
              </div>
            </a>
          </li>
        </ul>
      </div>
    </section>

  </main>

  <!-- ============================================
       フッター（他ページと共通）
  ============================================ -->
  <footer class="site-footer" id="contact">
    <div class="site-footer__inner">
      <img src="assets/images/logo-white.svg" alt="喋る猫カフェ -talk cat cafe-" class="site-footer__logo" width="180" height="59">

      <ul class="site-footer__sns">
        <li>
          <a href="https://x.com/talkcatcafe_VR" class="social-icon" aria-label="Twitter（新X）" target="_blank" rel="noopener noreferrer">
            <img src="assets/images/X_logo_2023.svg" alt="" width="16" height="16">
          </a>
        </li>
        <li>
          <a href="https://www.instagram.com/talkcatcafe/" class="social-icon" aria-label="Instagram" target="_blank" rel="noopener noreferrer">
            <img src="assets/images/Instagram_Glyph_Black.svg" alt="" width="16" height="16">
          </a>
        </li>
        <li>
          <a href="https://www.youtube.com/@talkcatcafe" class="social-icon" aria-label="YouTube" target="_blank" rel="noopener noreferrer">
            <img src="assets/images/youtube-123.svg" alt="" width="20" height="20">
          </a>
        </li>
        <li>
          <a href="https://www.tiktok.com/@talkcatcafe" class="social-icon" aria-label="TikTok" target="_blank" rel="noopener noreferrer">
            <img src="assets/images/tik-tok.svg" alt="" width="20" height="20">
          </a>
        </li>
      </ul>

      <nav class="site-footer__nav" aria-label="フッターナビゲーション">
        <ul class="site-footer__nav-list">
          <li><a href="concept.html">コンセプト</a></li>
          <li><a href="menu.html">メニュー</a></li>
          <li><a href="store.html">店舗</a></li>
          <li><a href="cast.html">キャスト</a></li>
          <li><a href="system.html">システム</a></li>
          <li><a href="guide.html">参加案内</a></li>
          <li><a href="about.html">運営情報</a></li>
          <li><a href="contact.html">お問い合わせ</a></li>
        </ul>
      </nav>

      <p class="site-footer__copyright">&copy; 2026 喋る猫カフェ -talk cat cafe-</p>
    </div>
  </footer>

  <div class="paw-trail" aria-hidden="true"></div>

  <script src="js/main.js" defer></script>
</body>
</html>
